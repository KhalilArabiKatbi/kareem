[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kareem"
version = "0.1.0"
description = "Kareem — a trained intervention policy for agent context health: when to compact, prune, or re-inject instructions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1"]

[project.scripts]
kareem-shadow = "kareem.shadow:main"

[tool.setuptools]
packages = ["kareem", "kareem.integrations"]

[tool.setuptools.package-data]
kareem = ["weights/*"]
